<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Realm Counter</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root{
      color-scheme:dark;
      --bg:#07111f;--panel:#101a2e;--panel2:#16233d;--text:#f4f7fb;
      --muted:#9badc6;--danger:#ff6b6b;--ok:#63d297;--line:#263754;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    button,input{font:inherit} button{touch-action:manipulation}
    .app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:5px;padding:5px;overflow:hidden}
    header{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:34px}
    h1{font-size:15px;line-height:1;margin:0;white-space:nowrap}.brandline{display:flex;align-items:center;gap:6px}.version{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 5px}
    .top-actions{display:flex;gap:4px;min-width:0}
    .btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:6px 8px;border-radius:9px;font-weight:750;font-size:11px;white-space:nowrap}
    .btn.secondary{background:transparent}.btn.danger{border-color:#5d2b36;color:#ffd5d8}
    .players{min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:5px}
    .players.boss-mode{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
    .players.boss-mode .boss-card{grid-column:1 / -1}
    .players.boss-mode.boss-two{grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(0,1fr))}
    .players.boss-mode.boss-two .boss-card{grid-column:1}
    .players.boss-mode.boss-three{grid-template-columns:repeat(2,minmax(0,1fr))}
    .players.boss-mode.boss-three .boss-card{grid-column:1 / -1}
    .card{position:relative;min-width:0;min-height:0;background:linear-gradient(180deg,#16233d,#0e192d);
      border:1px solid var(--line);border-radius:13px;padding:6px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
    .card.dead{opacity:.62;filter:saturate(.55)}
    .empty-slot{border:1px dashed var(--line);border-radius:13px;display:flex;align-items:center;justify-content:center}
    .empty-slot button{font-size:13px}
    .player-head{display:flex;align-items:center;gap:3px;min-width:0;position:relative;padding-right:38px}
    .name{width:100%;min-width:0;background:transparent;border:0;color:var(--text);font-weight:800;font-size:13px;outline:none;padding:2px}
    .remove{width:24px;height:24px;flex:0 0 24px;padding:0;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:900}
    .series-wins{position:absolute;right:0;top:0;min-width:32px;height:24px;display:flex;align-items:center;justify-content:center;gap:3px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:11px;font-weight:800;color:#f4d77f}
    .role-badge{position:absolute;left:6px;top:30px;z-index:3;padding:2px 6px;border-radius:999px;border:1px solid var(--line);background:rgba(7,17,31,.78);font-size:9px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    .boss-card .role-badge{color:#f4d77f;border-color:#6a5b2d}
    .winner-card{outline:2px solid rgba(244,215,127,.65);box-shadow:0 0 0 2px rgba(244,215,127,.08) inset}
    .winner-trophy{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(34px,6vh,58px);filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));pointer-events:none;z-index:2}
    .game-over-lock .controls,.game-over-lock .remove{pointer-events:none;opacity:.45}
    .score-wrap{min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    .score{border:0;background:transparent;color:var(--text);font-size:clamp(38px,8.8vh,78px);font-weight:900;line-height:.92;letter-spacing:-.05em;padding:2px 6px}
    .score.zero{color:var(--danger)}
    .delta-float{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:clamp(17px,3vh,25px);font-weight:900;opacity:0;pointer-events:none}
    .delta-float.show{animation:fadeDelta 3s ease forwards}.delta-float.plus{color:var(--ok)}.delta-float.minus{color:var(--danger)}
    @keyframes fadeDelta{0%{opacity:0;transform:translate(-50%,5px)}12%{opacity:1;transform:translate(-50%,0)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
    .controls{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:3px}
    .score-btn{border:1px solid var(--line);padding:7px 1px;border-radius:9px;font-size:17px;font-weight:900}
    .score-btn.minus,.custom-minus{background:#2b151a;border-color:#553039;color:#ffd0d4}
    .score-btn.plus,.custom-plus{background:#10291f;border-color:#214b3a;color:#bff4d6}
    .custom-change{min-width:0;display:grid;grid-template-columns:31px minmax(0,1fr) 31px;gap:3px}
    .custom-input{width:100%;min-width:0;background:#091321;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 2px;text-align:center;font-size:14px;font-weight:800}
    .apply-btn{border:1px solid var(--line);border-radius:8px;padding:0;font-size:17px;font-weight:900}
    dialog{border:1px solid var(--line);background:#0e192c;color:var(--text);border-radius:15px;width:min(92vw,420px);max-height:82dvh;overflow:auto}
    dialog::backdrop{background:rgba(0,0,0,.7)}
    .dialog-row{display:flex;gap:8px;align-items:center;margin-top:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
    dialog input{background:#091321;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;font-weight:800}
    .settings-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
    .hint{color:var(--muted);font-size:12px}
    .log{display:flex;flex-direction:column;gap:4px;max-height:60dvh;overflow:auto}
    .log-entry{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:7px;padding:6px 0;border-top:1px solid rgba(38,55,84,.7);font-size:12px}
    .log-entry:first-child{border-top:0}.log-time{color:var(--muted)}.log-change.plus{color:var(--ok);font-weight:800}.log-change.minus{color:var(--danger);font-weight:800}

    .gameover-title{font-size:20px;font-weight:900;margin:0 0 6px}
    .gameover-winner{font-size:15px;margin:0;color:#f4d77f}
    .gameover-actions{display:flex;justify-content:center;gap:8px;margin-top:16px}
    .gameover-actions .btn{min-width:118px}
    @media(max-height:650px){.app{padding:3px;gap:3px}header{min-height:29px}.btn{padding:5px 6px}.card{padding:4px}.score{font-size:clamp(31px,7.4vh,55px)}.controls{grid-template-columns:37px minmax(0,1fr) 37px}.custom-change{grid-template-columns:27px minmax(0,1fr) 27px}.score-btn{padding:4px 1px}.custom-input{padding:3px 1px;font-size:12px}}
    @media(max-width:390px){h1{font-size:13px}.btn{font-size:10px;padding:5px 6px}.controls{grid-template-columns:38px minmax(0,1fr) 38px}.custom-change{grid-template-columns:28px minmax(0,1fr) 28px}}
  </style>
</head>
<body>
<main class="app">
  <header>
    <div class="brandline"><h1>Realm Counter</h1><span class="version">v8</span></div>
    <div class="top-actions">
      <button id="undoBtn" class="btn secondary">↶</button>
      <button id="wakeBtn" class="btn secondary">☀</button>
      <button id="logBtn" class="btn secondary">Log</button>
      <button id="settingsBtn" class="btn secondary">⚙</button>
      <button id="newBtn" class="btn danger">Neu</button>
    </div>
  </header>
  <section id="players" class="players"></section>
</main>

<dialog id="scoreDialog">
  <form method="dialog" id="scoreForm">
    <strong>Punktestand setzen</strong>
    <div class="dialog-row"><input id="scoreInput" type="number" inputmode="numeric" min="0" max="9999"></div>
    <div class="dialog-actions"><button value="cancel" class="btn secondary">Abbrechen</button><button value="default" class="btn">Speichern</button></div>
  </form>
</dialog>

<dialog id="settingsDialog">
  <strong>Einstellungen</strong>
  <div class="settings-row"><label for="modeSelect">Spielmodus</label>
    <select id="modeSelect" class="btn">
      <option value="ffa">FFA</option>
      <option value="boss">Boss Mode</option>
    </select></div>
  <div class="settings-row"><label for="startScore">Startpunkte</label><input id="startScore" type="number" inputmode="numeric" min="1" max="999" value="50"></div>
  <div class="settings-row"><span>Spieler</span><button id="addBtn" class="btn">+ Spieler</button></div>
  <p id="wakeStatus" class="hint"></p>
  <div class="dialog-actions"><button id="closeSettingsBtn" class="btn">Schließen</button></div>
</dialog>

<dialog id="logDialog">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
    <strong>Spielverlauf</strong><button id="clearLogBtn" class="btn secondary">Löschen</button>
  </div>
  <div id="log" class="log"></div>
  <div class="dialog-actions"><button id="closeLogBtn" class="btn">Schließen</button></div>
</dialog>


<dialog id="gameOverDialog">
  <div class="gameover-title">Spiel beendet</div>
  <p id="gameOverWinner" class="gameover-winner"></p>
  <div class="gameover-actions">
    <button id="continueSeriesBtn" class="btn">Neues Spiel</button>
    <button id="endSeriesBtn" class="btn secondary" aria-label="Serie beenden">×</button>
  </div>
</dialog>

<script>
const STORAGE_KEY="realm-counter-state-v8";
const OLD_STORAGE_KEYS=["realm-counter-state-v7","realm-counter-state-v6","realm-counter-state-v5","realm-counter-state-v4","realm-counter-state-v3","realm-counter-state-v2","realm-counter-state-v1"];
const MAX_PLAYERS=4, MIN_PLAYERS=2;
const defaultState=()=>({startScore:50,mode:"ffa",bossIndex:0,players:[
  {id:crypto.randomUUID(),name:"Spieler 1",score:50,wins:0},
  {id:crypto.randomUUID(),name:"Spieler 2",score:50,wins:0}
],history:[],log:[],gameOver:false,winnerIds:[]});

let state;
try{
  const saved=localStorage.getItem(STORAGE_KEY)||OLD_STORAGE_KEYS.map(k=>localStorage.getItem(k)).find(Boolean);
  state=saved?JSON.parse(saved):defaultState();
}catch{state=defaultState()}
state.history ||= []; state.log ||= []; state.gameOver ||= false; state.winnerIds ||= []; state.mode ||= "ffa"; state.bossIndex ??= 0; state.players=state.players.map(p=>({...p,wins:p.wins||0}));

const playersEl=document.getElementById("players"),startScoreEl=document.getElementById("startScore"),modeSelect=document.getElementById("modeSelect"),
addBtn=document.getElementById("addBtn"),undoBtn=document.getElementById("undoBtn"),wakeBtn=document.getElementById("wakeBtn"),
logBtn=document.getElementById("logBtn"),settingsBtn=document.getElementById("settingsBtn"),newBtn=document.getElementById("newBtn"),
wakeStatusEl=document.getElementById("wakeStatus"),logEl=document.getElementById("log"),clearLogBtn=document.getElementById("clearLogBtn"),
scoreDialog=document.getElementById("scoreDialog"),scoreInput=document.getElementById("scoreInput"),scoreForm=document.getElementById("scoreForm"),
settingsDialog=document.getElementById("settingsDialog"),logDialog=document.getElementById("logDialog"),
gameOverDialog=document.getElementById("gameOverDialog"),gameOverWinner=document.getElementById("gameOverWinner"),
continueSeriesBtn=document.getElementById("continueSeriesBtn"),endSeriesBtn=document.getElementById("endSeriesBtn");

let editingPlayerId=null,wakeLock=null,wakeRequested=false;
const deltaAccumulators=new Map();

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function snapshot(){state.history.push({players:state.players.map(p=>({...p})),startScore:state.startScore,mode:state.mode,bossIndex:state.bossIndex,log:state.log.map(x=>({...x})),gameOver:state.gameOver,winnerIds:[...(state.winnerIds||[])]});if(state.history.length>100)state.history.shift()}
function addLog(player,delta,from,to,type="change"){state.log.unshift({id:crypto.randomUUID(),time:Date.now(),player:player.name,delta,from,to,type});if(state.log.length>200)state.log.length=200}
function formatTime(ts){return new Date(ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"})}

function renderLog(){
  if(!state.log.length){logEl.innerHTML='<div class="hint">Noch keine Änderungen.</div>';return}
  logEl.innerHTML=state.log.map(e=>{
    const sign=e.delta>0?"+":"",cls=e.delta>0?"plus":e.delta<0?"minus":"";
    const middle=e.type==="gameover"?(e.text||"Spiel beendet"):e.type==="newgame"?"Neues Spiel":`${esc(e.player)} · ${e.from} → ${e.to}`;
    return `<div class="log-entry"><span class="log-time">${formatTime(e.time)}</span><span>${middle}</span><span class="log-change ${cls}">${e.delta?sign+e.delta:""}</span></div>`
  }).join("")
}

function render(){
  startScoreEl.value=state.startScore;
  modeSelect.value=state.mode;
  playersEl.innerHTML="";
  playersEl.className="players";

  let renderPlayers=[...state.players];
  if(state.mode==="boss" && state.players.length){
    state.bossIndex=((state.bossIndex%state.players.length)+state.players.length)%state.players.length;
    const boss=state.players[state.bossIndex];
    renderPlayers=[boss,...state.players.filter(p=>p.id!==boss.id)];
    playersEl.classList.add("boss-mode");
    if(state.players.length===2)playersEl.classList.add("boss-two");
    if(state.players.length===3)playersEl.classList.add("boss-three");
  }

  for(let slot=0;slot<MAX_PLAYERS;slot++){
    const player=renderPlayers[slot];
    if(!player){
      const empty=document.createElement("div");
      empty.className="empty-slot";
      empty.innerHTML='<button class="btn secondary" data-action="add-slot">+ Spieler</button>';
      playersEl.appendChild(empty); continue;
    }
    const card=document.createElement("article");
    const isWinner=(state.winnerIds||[]).includes(player.id);
    const bossPlayer=state.mode==="boss"&&state.players[state.bossIndex]?.id===player.id;
    card.className="card"+(player.score<=0?" dead game-over-lock":"")+(isWinner?" winner-card":"")+(state.gameOver?" game-over-lock":"")+(bossPlayer?" boss-card":"");
    card.innerHTML=`
      ${state.mode==="boss"?`<div class="role-badge">${bossPlayer?"Boss":"Team"}</div>`:""}
      <div class="player-head">
        <input class="name" data-action="name" data-id="${player.id}" maxlength="24" value="${esc(player.name)}">
        <button class="remove" data-action="remove" data-id="${player.id}">×</button>
        <div class="series-wins" title="Serienpunkte">★ ${player.wins||0}</div>
      </div>
      <div class="score-wrap">
        ${isWinner?'<div class="winner-trophy" aria-hidden="true">🏆</div>':""}
        <div id="delta-${player.id}" class="delta-float"></div>
        <button class="score ${player.score<=0?"zero":""}" data-action="edit" data-id="${player.id}">${player.score}</button>
      </div>
      <div class="controls">
        <button class="score-btn minus" data-action="change" data-id="${player.id}" data-delta="-1">−1</button>
        <div class="custom-change">
          <button class="apply-btn custom-minus" data-action="custom-apply" data-sign="-1" data-id="${player.id}">−</button>
          <input class="custom-input" data-action="custom-input" data-id="${player.id}" type="number" inputmode="numeric" min="1" max="9999" placeholder="Punkte">
          <button class="apply-btn custom-plus" data-action="custom-apply" data-sign="1" data-id="${player.id}">+</button>
        </div>
        <button class="score-btn plus" data-action="change" data-id="${player.id}" data-delta="1">+1</button>
      </div>`;
    playersEl.appendChild(card)
  }
  undoBtn.disabled=!state.history.length;
  addBtn.disabled=state.players.length>=MAX_PLAYERS;
  renderLog(); updateWakeUi(); save()
}

function flashDelta(id,delta){
  const prev=deltaAccumulators.get(id), total=(prev?.total||0)+delta;
  if(prev?.timer)clearTimeout(prev.timer);
  const el=document.getElementById(`delta-${id}`); if(!el)return;
  el.className="delta-float"; void el.offsetWidth;
  el.textContent=total>0?`+${total}`:`${total}`;
  if(total>0)el.classList.add("plus"); else if(total<0)el.classList.add("minus");
  el.classList.add("show");
  const timer=setTimeout(()=>deltaAccumulators.delete(id),3000);
  deltaAccumulators.set(id,{total,timer})
}
function checkForGameOver(){
  if(state.gameOver)return;

  if(state.mode==="boss"){
    const boss=state.players[state.bossIndex];
    const team=state.players.filter(p=>p.id!==boss.id);

    if(boss.score<=0){
      state.gameOver=true;
      state.winnerIds=team.map(p=>p.id);
      team.forEach(p=>p.wins=(p.wins||0)+1);
      state.log.unshift({id:crypto.randomUUID(),time:Date.now(),player:"Spiel",delta:0,from:0,to:0,type:"gameover",text:`Team gewinnt gegen ${boss.name}`});
      render();showGameOver();return;
    }

    if(team.every(p=>p.score<=0)){
      state.gameOver=true;
      state.winnerIds=[boss.id];
      boss.wins=(boss.wins||0)+2;
      state.log.unshift({id:crypto.randomUUID(),time:Date.now(),player:"Spiel",delta:0,from:0,to:0,type:"gameover",text:`${boss.name} gewinnt als Boss (+2)`});
      render();showGameOver();return;
    }

    render();return;
  }

  const active=state.players.filter(p=>p.score>0);
  if(active.length>1){render();return}

  if(active.length===1){
    const winner=active[0];
    state.gameOver=true;
    state.winnerIds=[winner.id];
    winner.wins=(winner.wins||0)+1;
    state.log.unshift({id:crypto.randomUUID(),time:Date.now(),player:"Spiel",delta:0,from:0,to:0,type:"gameover",text:`${winner.name} gewinnt`});
    render();showGameOver();return;
  }

  state.gameOver=true;
  state.winnerIds=[];
  state.log.unshift({id:crypto.randomUUID(),time:Date.now(),player:"Spiel",delta:0,from:0,to:0,type:"gameover",text:"Partie endet ohne Sieger"});
  render();showGameOver();
}

function showGameOver(){
  if(!state.gameOver)return;
  const winners=state.players.filter(p=>(state.winnerIds||[]).includes(p.id));
  if(state.mode==="boss"){
    const boss=state.players[state.bossIndex];
    if(winners.length===1&&winners[0].id===boss?.id){
      gameOverWinner.textContent=`${boss.name} gewinnt als Boss und erhält 2 Punkte.`;
    }else{
      gameOverWinner.textContent="Das Team gewinnt. Alle Nicht-Boss-Spieler erhalten je 1 Punkt.";
    }
  }else{
    gameOverWinner.textContent=winners.length===1?`${winners[0].name} gewinnt die Partie.`:"Partie beendet.";
  }
  if(!gameOverDialog.open)gameOverDialog.showModal();
}

function startNextGame(){
  state.gameOver=false;
  state.winnerIds=[];
  if(state.mode==="boss"&&state.players.length)state.bossIndex=(state.bossIndex+1)%state.players.length;
  state.players=state.players.map(p=>({...p,score:state.startScore}));
  state.history=[];
  state.log.unshift({id:crypto.randomUUID(),time:Date.now(),player:"Serie",delta:0,from:0,to:0,type:"newgame"});
  save();
  if(gameOverDialog.open)gameOverDialog.close();
  render();
}

function endSeries(){
  state.gameOver=false;
  state.winnerIds=[];
  state.bossIndex=0;
  state.players=state.players.map(p=>({...p,score:state.startScore,wins:0}));
  state.history=[];
  state.log=[];
  save();
  if(gameOverDialog.open)gameOverDialog.close();
  render();
}

function changeScore(player,delta){
  if(state.gameOver)return;
  const from=player.score,to=Math.max(0,from+delta),actual=to-from;if(!actual)return;
  snapshot();player.score=to;addLog(player,actual,from,to);
  const reachedZero=to===0;
  render();
  requestAnimationFrame(()=>flashDelta(player.id,actual));
  if(reachedZero)checkForGameOver();
}
function addPlayer(){
  if(state.players.length>=MAX_PLAYERS)return;
  snapshot();const n=state.players.length+1;
  state.players.push({id:crypto.randomUUID(),name:`Spieler ${n}`,score:state.startScore,wins:0});render()
}

playersEl.addEventListener("click",e=>{
  const btn=e.target.closest("[data-action]");if(!btn)return;
  if(btn.dataset.action==="add-slot"){addPlayer();return}
  const id=btn.dataset.id,player=state.players.find(p=>p.id===id);if(!player)return;
  if((state.gameOver || player.score<=0) && !["name"].includes(btn.dataset.action))return;
  if(btn.dataset.action==="change")changeScore(player,Number(btn.dataset.delta));
  if(btn.dataset.action==="custom-apply"){
    const input=playersEl.querySelector(`[data-action="custom-input"][data-id="${id}"]`);
    const amount=Math.abs(Number(input?.value));if(!Number.isFinite(amount)||amount===0)return;
    changeScore(player,amount*(Number(btn.dataset.sign)||1));input.value="";input.blur()
  }
  if(btn.dataset.action==="remove"){
    if(state.players.length<=MIN_PLAYERS)return;snapshot();state.players=state.players.filter(p=>p.id!==id);render()
  }
  if(btn.dataset.action==="edit"){editingPlayerId=id;scoreInput.value=player.score;scoreDialog.showModal();setTimeout(()=>scoreInput.select(),50)}
});
playersEl.addEventListener("input",e=>{
  if(!e.target.matches('[data-action="name"]'))return;
  const p=state.players.find(p=>p.id===e.target.dataset.id);if(p){p.name=e.target.value;save()}
});

scoreForm.addEventListener("submit",()=>{
  if(scoreDialog.returnValue==="cancel")return;
  const p=state.players.find(p=>p.id===editingPlayerId);if(!p||state.gameOver)return;
  const from=p.score,to=Math.max(0,Math.min(9999,Number(scoreInput.value)||0));
  if(from!==to){
    snapshot();p.score=to;addLog(p,to-from,from,to,"set");
    const reachedZero=to===0;
    render();
    requestAnimationFrame(()=>flashDelta(p.id,to-from));
    if(reachedZero)checkForGameOver();
  }
  editingPlayerId=null
});

undoBtn.addEventListener("click",()=>{const prev=state.history.pop();if(!prev)return;state.players=prev.players;state.startScore=prev.startScore;state.mode=prev.mode||"ffa";state.bossIndex=prev.bossIndex||0;state.log=prev.log;state.gameOver=prev.gameOver;state.winnerIds=prev.winnerIds||[];if(gameOverDialog.open)gameOverDialog.close();render();if(state.gameOver)showGameOver()});
newBtn.addEventListener("click",()=>{if(!confirm(`Aktuelle Partie zurücksetzen? Die Serie bleibt erhalten.`))return;snapshot();state.gameOver=false;state.winnerIds=[];state.players=state.players.map((p,i)=>({...p,name:p.name||`Spieler ${i+1}`,score:state.startScore}));state.log=[];if(gameOverDialog.open)gameOverDialog.close();render()});
addBtn.addEventListener("click",addPlayer);
startScoreEl.addEventListener("change",()=>{state.startScore=Math.max(1,Math.min(999,Number(startScoreEl.value)||50));save();render()});
modeSelect.addEventListener("change",()=>{
  const next=modeSelect.value==="boss"?"boss":"ffa";
  if(next===state.mode)return;
  state.mode=next;
  state.bossIndex=0;
  state.gameOver=false;
  state.winnerIds=[];
  state.players=state.players.map(p=>({...p,score:state.startScore,wins:0}));
  state.history=[];
  state.log=[];
  save();
  render();
});

logBtn.addEventListener("click",()=>{renderLog();logDialog.showModal()});
document.getElementById("closeLogBtn").addEventListener("click",()=>logDialog.close());
clearLogBtn.addEventListener("click",()=>{if(!state.log.length)return;snapshot();state.log=[];renderLog();save()});
settingsBtn.addEventListener("click",()=>settingsDialog.showModal());
document.getElementById("closeSettingsBtn").addEventListener("click",()=>settingsDialog.close());
continueSeriesBtn.addEventListener("click",startNextGame);
endSeriesBtn.addEventListener("click",endSeries);

async function requestWakeLock(){
  wakeRequested=true;
  if(!("wakeLock" in navigator)){wakeStatusEl.textContent="Wake Lock wird von diesem Browser nicht unterstützt.";updateWakeUi();return}
  try{
    wakeLock=await navigator.wakeLock.request("screen");
    wakeStatusEl.textContent="Bildschirm bleibt an.";
    wakeLock.addEventListener("release",()=>{wakeLock=null;updateWakeUi()})
  }catch{wakeStatusEl.textContent="Wake Lock konnte nicht aktiviert werden."}
  updateWakeUi()
}
async function releaseWakeLock(){
  wakeRequested=false;if(wakeLock){try{await wakeLock.release()}catch{}wakeLock=null}
  wakeStatusEl.textContent="Wake Lock aus.";updateWakeUi()
}
function updateWakeUi(){wakeBtn.textContent=wakeLock?"☀✓":"☀"}
wakeBtn.addEventListener("click",()=>{if(wakeLock||wakeRequested)releaseWakeLock();else requestWakeLock()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&wakeRequested&&!wakeLock)requestWakeLock()});

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
render();
if(state.gameOver)setTimeout(showGameOver,50);
</script>
</body>
</html>
